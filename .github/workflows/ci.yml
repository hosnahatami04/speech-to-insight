name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.7"

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check src tests

      - name: Format check
        run: uv run ruff format --check src tests

      - name: Typecheck
        run: uv run mypy

      - name: Test with coverage gate
        env:
          PYTHONHASHSEED: "0"
        run: uv run pytest -m "not ml" --cov --cov-report=term --cov-fail-under=85

      - name: KPI smoke gate
        run: uv run speechinsight evaluate-smoke

      - name: Dependency audit
        run: uv run pip-audit --strict || echo "pip-audit reported issues (non-fatal in CI)"

  docker-build:
    runs-on: ubuntu-latest
    needs: main
    steps:
      - uses: actions/checkout@v4

      - name: Build docker image
        run: docker build -t speech-to-insight:ci .
