seed: 0

paths:
  data: data
  artifacts: artifacts
  reports: reports
  cache: artifacts/cache

# Each model is pinned to an exact repository revision so resolved weights are
# reproducible. These revisions were verified reachable and non-gated.
models:
  asr_tiny:
    repo: Systran/faster-whisper-tiny.en
    revision: 0d3d19a32d3338f10357c0889762bd8d64bbdeba
  asr_base:
    repo: Systran/faster-whisper-base.en
    revision: 3d3d5dee26484f91867d81cb899cfcf72b96be6c
  asr_small:
    repo: Systran/faster-whisper-small.en
    revision: d1d751a5f8271d482d14ca55d9e2deeebbae577f
  speaker_embedding:
    repo: speechbrain/spkrec-ecapa-voxceleb
    revision: 0f99f2d0ebe89ac095bcc5903c4dd8f72b367286
  nli:
    repo: cross-encoder/nli-deberta-v3-small
    revision: fa2804872c3b4bd748f38c0185cc85775361e735
  matcher_embedding:
    repo: sentence-transformers/all-MiniLM-L6-v2
    revision: 1110a243fdf4706b3f48f1d95db1a4f5529b4d41

